## Holiday events (consolidated JP + EN source of truth)
## Each `start:` is a fully-qualified ISO timestamp (date + time + offset).
## Drop-time conventions encoded in those timestamps:
##   New Year:    05:00 JST (early release for temple visits — a JP-server exception)
##   Golden Week: 12:00 JST (standard JP content drop)
##   EN:          22:00 UTC (canonical "appeared on Global" instant)

## New Year
## Lead-in / extension campaigns (New Year Countdown, Celebration, …) live in
## static/anchored.yaml — they pin to these launches rather than carry dates.

new-year-2022:
  jp:
    start: 2022-01-01T05:00:00+09:00
  en:
    start: 2026-01-27T22:00:00+00:00

new-year-2023:
  jp:
    start: 2023-01-01T05:00:00+09:00

new-year-2024:
  jp:
    start: 2024-01-01T05:00:00+09:00



new-year-2025:
  jp:
    start: 2025-01-01T05:00:00+09:00

new-year-2026:
  jp:
    start: 2026-01-01T05:00:00+09:00

