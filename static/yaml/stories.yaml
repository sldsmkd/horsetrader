## Stories — EN overlay for the Gametora-scraped JP corpus.
## Keys are zero-padded stable keys (story-NNN) matching the downstream form;
## Gametora's unpadded ordinal lives in `correlations["gametora"]` on the
## scraped model, not here.
## Each entry sits under an `en:` block holding FQ ISO timestamps (22:00 UTC, EN
## content-refresh time) and an optional `name:` field. `en.name:` overrides
## Gametora's scraped EN title — initially a community fansub; updated by the
## maintainer when Cygames officially renames a story on EN release.

