## Anniversary celebration reward streams — CAPTURED, not yet wired.
##
## NUMBER AUTHORITY: the official Cygames campaign announcements (umamusume.jp
## news). The GameWith wiki UNDERCOUNTS — it folds the separate mailbox present
## into the login bonus — and login_bonus.yaml's bottom QA list inherited that
## error. Cygames > wiki. Gemini's research had the numbers RIGHT (it just got
## tangled in the major/minor phase divergence); use it as the structural backbone
## and the numbers, pending per-anniversary Cygames confirmation.
##
## STATUS: staging (config/pending/ — not loaded). Awaiting the remaining Cygames
## announcements (user is pasting on reset). 2.0 is Cygames-CONFIRMED below;
## others carry `verify: cygames`.
##
## THE TWO P2 CARAT SOURCES ARE SEPARATE AND ADDITIVE (the correction):
## - `present`: a standalone 3,000-jewel mailbox gift ([Present] on home, ~30-day
##   claim). Authoritative for 2.0: "a gift of up to 6000 jewels" = present 3,000
##   + login 3,000.
## - `login`: the commemorative login BONUS — 300/day, up to 3,000 over ≤10 days
##   (P2); countdown 1,500/1,200 (P1); mid 2,250 (P3, major). Separate from the
##   present.
## So a major P2 contributes ~6,000 (3,000 + 3,000), NOT 3,000.
##
## - This layer is the login + present streams. Mission carats (~500/part) are
##   already on the scraped AnniversaryMissions — do NOT re-add them here.
## - Free pulls are banner-owned (banners.yaml `pulls: N`, HH.5.16); `# free pulls`
##   notes only. Major-anni P4 is a pure banner-pull window.
## - `premium:` = out of model scope (2+3 SSR promo card → 5 copies = full 4凸,
##   SSR selector ticket, livestream materials).
## Dates JP, date-only; phase N = 第N弾 part N (windows scrape-corroborated).

