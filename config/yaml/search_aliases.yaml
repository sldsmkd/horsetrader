# Community search aliases — the nicknames players actually type, which the
# bake folds onto each atom's `aliases` so the front-end typeahead matches them.
#
# Each entry lives in its own `alias-<body>` namespace and points at a `target`
# stable key (the same indirection anchored events use with `anchor:`):
#
#   alias-<body>:
#     target: <stable-key>      # char- / trainee- / support-
#     phrases: [phrase, ...]    # what gets typed in the search box
#
# A `char-` target applies to EVERY trainee + support of that character; a
# `trainee-` / `support-` target applies to that one card. Every target must
# resolve to a baked atom — a dangling target fails the bake loud (a typo'd id
# or a character with no cards). Copy a neighbour to add more.

