#
# These bake as `holiday` records, same as Golden Week / New Year. Use
# `holiday-marketing-<slug>` keys, region-agnostic `name` / reward contents /
# `banner`, a required JP block, and an EN block only once Global has shipped it.
# A sparse sequence may use the confirmed Global payout dates because Global is
# the planner's output region; preserve the shared count/value, not JP's spacing.

holiday-marketing-starhorse-4:
  name: Star Horse 4
  rewards:
    generator:
      free_carats: 150
      repeat: 10
  jp:
    start: 2022-07-20T12:00:00+09:00
    duration: P10D
  en:
    start: 2026-06-25T22:00:00+00:00
  banner: https://prd-info-umamusume.akamaized.net/announce/860/Thumbnail/banner_25300001.png

