## CHAMPIONS MEETINGS — EN overlay ##
#
# TODO: scrape target - these images are gold - https://game8.co/games/Umamusume-Pretty-Derby/archives/541155
#
# EN-server release windows for Champions Meetings, keyed by the Gametora
# chronological occurrence ordinal, zero-padded to 3 (cm-NNN) — the same
# stable key the scraper assigns (see extractors/gametora/champions_meetings.py).
# The EN server replays JP's CM sequence in order, so cm-001 (Taurus, 2400
# Tokyo) is JP's first CM from 2021 but reached Global in Aug 2025.
#
# A CM absent here has no confirmed EN window and stays predicted; one that
# IS present but malformed fails loud (curated data) — incl. en.end <= en.start.
#
# WINDOW SEMANTICS — these are the EN AVAILABILITY (marketing) windows from
# Cygames' monthly Release Schedule image: drop 22:00 UTC, run usually-but-not-
# always 10 days. This is deliberately LONGER than the JP-scraped COMPETITION
# window, which Gametora records as always exactly 6 days (2d quali / 2d group /
# 1d reg / 1d final) — EN adds the pre-registration lead-in on the front. The
# two spans differ by source, not by error — see docs/domain.md. `start` =
# availability open, `end` = availability close (next-morning instant). The
# competition final lands near `end`; the *final day* is the stable anchor for
# prediction, not the opening day (final is precomputed, opening drifts).
cm-001:
  # Taurus Cup: 2400m Tokyo
  en:
    start: 2025-08-17T22:00:00+00:00
    end: 2025-08-27T22:00:00+00:00
