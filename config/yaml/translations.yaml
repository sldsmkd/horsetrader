# Curated JP→EN translations — the vocabulary the Shuttle tokenizer leans on
# (`horsetrader/services/_missions.py` + `_races.py`). The tokenizer owns the
# *grammar* (seasons, the 記念ミッション / 第N弾 / G1 tokens); this file owns the
# *strings* it can't derive structurally.
#
# Two namespaces, each a jp→en name pair (same shape as scenarios.yaml, minus
# the dates):
#
#   translate-mission-<slug>:   whole-string mission titles that fit no frame
#     jp: { name: "<japanese title>" }
#     en: { name: "<english title>" }
#
#   translate-race-<slug>:      NAR/local races whose `Race` entity has no `.en`
#     jp: { name: "<japanese race token, as it appears in titles>" }
#     en: { name: "<english race name>" }
#
# Both fail loud: a missing/blank jp.name or en.name raises so the bake run is
# the editor's feedback loop. Copy a neighbour to add more.
#
# translate-race- is the permanent home for these names, not a stopgap: the JRA
# race DB doesn't carry them (JDダービー has no `Race` entity at all; the others
# exist but Gametora ships no EN, and there's no race-`.en` curation path).

