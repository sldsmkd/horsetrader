## LEGEND RACES — EN overlay ##
#
# EN-server release windows for Legend Races, keyed by the Gametora chronological
# occurrence ordinal, zero-padded to 3 (legendrace-NNN) — the same stable key the
# scraper assigns (see extractors/gametora/legend_races.py). The EN server replays
# JP's Legend Race sequence in order, so legendrace-001 (Japan Cup, JP 2021-03)
# reached Global in Jul 2025.
#
# A race absent here has no confirmed EN window and stays predicted; one that IS
# present but malformed fails loud (curated data) — incl. en.end <= en.start.
#
# TIME-OF-DAY NOTE: these were hand-captured as bare dates (config/pending/
# _en.schedule.yaml). The bake serialises every event date-granular, so the time
# is immaterial to output — they're stamped at the EN-availability 22:00 UTC drop
# convention (same as champions_meetings.yaml). If the exact Legend Race open/close
# instants are ever confirmed, refine them here. `start` = availability open,
# `end` = availability close; the per-leg ~3-day cadence is derived at bake time
# from the JP-scraped legs, not curated here.
