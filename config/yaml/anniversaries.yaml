## Anniversary launches + celebration reward streams (consolidated JP + EN ground truth)
##
## DATES. Each `start:` is a fully-qualified ISO timestamp (date + time + offset),
## VERIFIED ground truth — cross-checked against wikiru and umamusume.com, not derived
## from a cadence formula. JP drops 12:00 JST; EN 22:00 UTC (the canonical "appeared on
## Global" instant). An `en:` block is present only once an anniversary has reached
## Global (0.5 and 1.0 so far); the rest get their EN date from the predictor. An
## anniversary is a scenario-shaped below-line launch (verified dates + derived name),
## NOT an empty anchor peg; the half/full version lives in the `anniversary-N_M` key.
##
## REWARD STREAMS hang on the part-MISSION keys (`mission-NNNNN`), co-located under their
## anniversary. The mission is the peg: it's the name the player saw, and its scraped
## window IS the phase window, so a sequence tiles the mission's own period — no
## hand-authored dates. Each value is a `SequenceReward(FreeCarats)` anchored at the
## part's START; the mission's scraped completion carats/tickets are left untouched
## (don't double-count). The scraped claim-windows are long and share one far deadline
## (player generosity, not cadence) — IGNORE them; `duration` below is the real window.
##
##   en.duration: the part's active EN WINDOW (ISO 8601, e.g. P10D) = the login length, so it
##             ends on the last login day. EN-only — it overrides the predicted/scraped EN span
##             (the generous claim window); the JP period keeps its scraped span (substrate). So
##             the EN parts flow on their real cadence and no reward is shown crediting a month late.
##   login:   per-day login bonus. Shapes (all 150/day except main):
##              p1 countdown  150 ×10  — len = anniversary-date − p1-start gap (halves
##                                       that open Aug16 run ×8 = 1200)
##              p2 main       300 ×10  — ten consecutive login days. Welfare SSR copies
##                                       are additional rewards on days 1 and 3, not
##                                       replacements for those days' 300 carats. We carry
##                                       the card once in mission `contents`; copy count
##                                       and timing remain outside the resource model.
##              p3 mid        150 ×15  — 4-phase majors only (sourced from 2.0's 第3弾);
##                                       halves' p3 is "late" = mission carats only, NO login
##
## PRESENT: every main part also gets a separate 3,000-jewel mailbox present on the
## anniversary day. `present: 3000` becomes a plain FreeCarats counter alongside the
## sequence, preserving the observed 300-carats login table while keeping the combined
## main-part total at 6,000 (2.0's Cygames-confirmed "up to 6000 jewels").
## Concrete Global reference: docs/references/anni/loginbonus.png (1.5th Part 2,
## day 1: Mihono Bourbon copy + 300 carats; the table shows card copies on days 1 and 3).

