# Standing reward structures — the procedural recipes the client expands itself.
# We bake the per-occurrence *numbers*; the client owns the *cadence* (how often
# the recipe pays, and when), keyed off the structure's stable key. Baked to
# config.json. See docs/contract.md "What crosses the wire" and #6.
#
# Region-agnostic (no jp:/en: blocks) — identical across regions. Keyed
# reward-structure-<slug>; the `rewards` block is the baked-shape mapping (same
# as an event's rewards). Copy a neighbour to add one.

reward-structure-dailies: # daily missions — a flat per-day grant; client fills the cadence
  rewards:
    free_carats: 75

reward-structure-daily-carats: # £5 30-day pack — 500 paid up front + 50 free carats/day for 30 days
  rewards:
    paid_carats: 500
    generator: # the free daily login bonus; client owns which 30 days
      free_carats: 50
      repeat: 30

reward-structure-weekly-login: # 7-day login week — free carats; days 1/3/5 = 25, day 7 = 75
  rewards:
    sequence:
      type: free_carats
      sequence: [25, Null, 25, Null, 25, Null, 75]

reward-structure-strongest-team: # limited mission component — baseline everyone who enters gets
  # Paired with reward-map-strongest-team (the rank component); client sums baseline + rank.
  rewards:
    free_carats: 300 # 50 × 6 scouts
    gold_crystal_shards: 1
    rainbow_crystal_shards: 1
    support_tickets: 1
    trainee_tickets: 1

# Rank-graded rewards (RewardMap) — keyed reward-map-<slug>; `tiers` maps each
# rank label to a baked-shape rewards block. The client selects the rank
# (sweatiness / account state); we don't care about frequency.

reward-map-team-trials: # Team Trials weekly carats, granted Monday at server reset.
  # Keyed <class>:<transition> — the carats depend on how you entered the class that
  # week (promotion in / retention / demotion in), not the class alone. The client
  # owns the weekly cadence: a stable class collects its `:retention` every Monday; a
  # "flapping" 5↔6 account alternates `6:promotion` (300) and `5:demotion` (225) —
  # which the old synthetic `5.5: 262` had pre-collapsed to their average. Values read
  # off the in-client Class Rewards table (free carats only; the Friend-Point
  # component is not carats/pulls, so it is dropped). Unobserved cells (lower-class
  # promotion, the class-1/2 edges) are omitted until captured.
  tiers:
    "6:promotion": { free_carats: 300 }
    "6:retention": { free_carats: 375 }
    "5:promotion": { free_carats: 225 }
    "5:retention": { free_carats: 225 }
    "5:demotion":  { free_carats: 225 }
    "4:promotion": { free_carats: 150 }
    "4:retention": { free_carats: 150 }
    "4:demotion":  { free_carats: 150 }
    "3:retention": { free_carats: 75 }
    "3:demotion":  { free_carats: 75 }
    "2:retention": { free_carats: 35 }

reward-map-club-rank: # Club Rank monthly income, graded by rank (placement is the client's selector)
  tiers:
    "SS": { free_carats: 4500 }
    "S+": { free_carats: 3600 }
    "S": { free_carats: 3150 }
    "A+": { free_carats: 2700 }
    "A": { free_carats: 2250 }
    "B+": { free_carats: 1800 }
    "B": { free_carats: 1350 }
    "C+": { free_carats: 900 }
    "C": { free_carats: 450 }
    "D+": { free_carats: 225 }

# CM / League pull tickets are split 50/50 into trainee_tickets + support_tickets
# (the scout tickets); all counts are even, so clean halves, written explicitly.
reward-map-champions-meeting: # graded by placement
  tiers:
    "Champion":        { free_carats: 3300, trainee_tickets: 5, support_tickets: 5 }
    "Second":          { free_carats: 2400, trainee_tickets: 4, support_tickets: 4 }
    "Third":           { free_carats: 1600, trainee_tickets: 3, support_tickets: 3 }
    "Group B 1st":     { free_carats: 1800, trainee_tickets: 3, support_tickets: 3 }
    "Group B 2nd":     { free_carats: 1250, trainee_tickets: 2, support_tickets: 2 }
    "Group B 3rd":     { free_carats: 1000, trainee_tickets: 1, support_tickets: 1 }
    "Open League 1st": { free_carats: 1500, trainee_tickets: 3, support_tickets: 3 }
    "Open League 2nd": { free_carats: 1250, trainee_tickets: 2, support_tickets: 2 }
    "Open League 3rd": { free_carats: 1000, trainee_tickets: 1, support_tickets: 1 }

reward-map-league-of-heroes: # graded by tier
  tiers:
    "Platinum 4": { free_carats: 3300, trainee_tickets: 2, support_tickets: 2 }
    "Platinum 3": { free_carats: 2800, trainee_tickets: 2, support_tickets: 2 }
    "Platinum 2": { free_carats: 2300, trainee_tickets: 2, support_tickets: 2 }
    "Platinum 1": { free_carats: 1800, trainee_tickets: 2, support_tickets: 2 }
    "Gold 4":     { free_carats: 1300, trainee_tickets: 2, support_tickets: 2 }
    "Gold 3":     { free_carats: 1000, trainee_tickets: 1, support_tickets: 1 }
    "Gold 2":     { free_carats: 700,  trainee_tickets: 1, support_tickets: 1 }
    "Gold 1":     { free_carats: 550 }
    "Silver 4":   { free_carats: 400 }

reward-map-strongest-team: # rank component, graded E→SS (paired with reward-structure-strongest-team baseline)
  tiers:
    "E":  { free_carats: 100 }
    "D":  { free_carats: 200 }
    "C":  { free_carats: 300 }
    "B":  { free_carats: 400 }
    "A":  { free_carats: 400,  support_tickets: 1, trainee_tickets: 1, gold_crystal_shards: 1 }
    "S":  { free_carats: 900,  support_tickets: 1, trainee_tickets: 1, gold_crystal_shards: 1, rainbow_crystal_shards: 1 }
    "SS": { free_carats: 1200, support_tickets: 1, trainee_tickets: 1, gold_crystal_shards: 1, rainbow_crystal_shards: 1 }

reward-map-masters: # Masters Challenge, graded by level (EX = L3 payout + intangible "bragging rights", not baked)
  tiers:
    "1":  { free_carats: 1500, gold_crystal_shards: 5 }
    "2":  { free_carats: 3000, gold_crystal_shards: 5, rainbow_crystal_shards: 5 }
    "3":  { free_carats: 4500, gold_crystal_shards: 5, rainbow_crystal_shards: 5 }
    "EX": { free_carats: 4500, gold_crystal_shards: 5, rainbow_crystal_shards: 5 }

# Training Pass battle-pass — the FREE track is baked onto each minted
# `TrainingPass` event (Mati's TrainingPassPredictor stamps it; it's unconditional
# income everyone gets). Only the PREMIUM track lives here: a single `premium`
# tier the client adds on top of the free track when the paid toggle is on — the
# same account-state selection a rank map drives, just binary. These are the
# ADDITIONAL rewards the paid track unlocks, summed onto the free track.
reward-map-training-pass:
  tiers:
    premium:
      free_carats: 1000
      paid_carats: 350
      trainee_tickets: 2
      support_tickets: 2
      rainbow_crystal_shards: 1

# Anniversary selector PACKS — the PAID exchange-voucher ladder. A pack grants ONE
# selector (of whichever type) bundled with paid carats; the only thing that
# escalates is the carat cost, so this is an ORDINAL ladder by pack LEVEL, shared
# across both selector types:
#   level 1 = value ("dolphin") pack — 1500 paid carats
#   level 2 = escalation ("whale") pack — 7500 paid carats
# The per-anniversary fact (how many paid packs of each type the store offered, 0/1/2)
# rides on the Anniversary record (`paid_ssr_selectors` / `paid_trainee_selectors`).
# The client expands: count N of a type → packs at levels 1..N, each = 1 selector of
# that type + that level's paid carats. Which pool the selector draws from is the
# anniversary → Selector entity join. The FREE SSR selector is NOT here — it's the
# 記念ミッション baseline reward on the mission. Selectors are counted, never valued.
reward-map-anniversary-selectors:
  tiers:
    "1": { paid_carats: 1500 } # value pack
    "2": { paid_carats: 7500 } # escalation pack

# Story events — graded by COMMITMENT tier, not by rank. Each tier is the
# player's TOTAL story-event income at an ascending Pt-commitment anchor: the
# three tracked-economy engines folded into one bundle. Tiers are deliberately
# preset-agnostic (`tier1`…`tier4`) — the client owns which preset seeds which
# tier; the bake must not know playstyle names.
#   - Pt-reward LADDER (scraped, fixed template): cumulative bundle at the tier's
#     absolute Pt anchor — tier1 150k / tier2 400k / tier3 ~620k (grabs the
#     2nd x300 carat row) / tier4 = ceiling.
#   - BINGO (curated, constant since story-3): 250 carats + 1 gold per clear,
#     ramping 1/2/3/3 clears across the tiers (the 3rd clear lands ~600k).
#   - STORY chapters (curated): flat 240 carats (8 × 30) at EVERY tier — even the
#     lightest tier plays for the story.
# Trailing comments decompose each carat total as ladder + bingo + 240 story.
# NOT modelled (by design): welfare support cards + the event song (not carat
# economy — we don't track them), and story-event mission carats (the lone
# story-11 +250 is a discounted N=1 scenario artifact). tier4 is the ceiling
# (600k→ceiling is featureless grind — the client folds its top presets here).
# Two maps keyed by Pt ceiling; the ONLY economy difference between eras is the
# `tier4` carat total. Proto era (stories 1–5) is historical, not modelled.
reward-map-story-1m: # mature era (stories 6–33) — 1,000,000 Pt ceiling
  tiers:
    tier0: { free_carats: 0 }                                                                                                 # no participation (explicit zero — empty {} trips fail-loud)
    tier1: { free_carats: 690,  gold_crystal_shards: 1, support_tickets: 1 }                                                # 200+250+240
    tier2: { free_carats: 1240, gold_crystal_shards: 2, rainbow_crystal_shards: 1, support_tickets: 1, trainee_tickets: 1 } # 500+500+240
    tier3: { free_carats: 1990, gold_crystal_shards: 3, rainbow_crystal_shards: 2, support_tickets: 2, trainee_tickets: 1 } # 1000+750+240
    tier4: { free_carats: 2490, gold_crystal_shards: 3, rainbow_crystal_shards: 3, support_tickets: 2, trainee_tickets: 2 } # 1500+750+240

reward-map-story-1-5m: # current era (stories 34+) — 1,500,000 Pt ceiling; only `tier4` differs from 1m
  tiers:
    tier0: { free_carats: 0 }                                                                                                 # no participation (explicit zero — empty {} trips fail-loud)
    tier1: { free_carats: 690,  gold_crystal_shards: 1, support_tickets: 1 }                                                # 200+250+240
    tier2: { free_carats: 1240, gold_crystal_shards: 2, rainbow_crystal_shards: 1, support_tickets: 1, trainee_tickets: 1 } # 500+500+240
    tier3: { free_carats: 1990, gold_crystal_shards: 3, rainbow_crystal_shards: 2, support_tickets: 2, trainee_tickets: 1 } # 1000+750+240
    tier4: { free_carats: 3240, gold_crystal_shards: 3, rainbow_crystal_shards: 3, support_tickets: 2, trainee_tickets: 2 } # 2250+750+240
